[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.2.0"
description = "Local-first personal AI orchestration system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "click>=8.1,<9",
    "rich>=13.9,<14",
    "tomli>=2.0,<3; python_version < '3.11'",
    "playwright>=1.40,<2",
    "croniter>=2.0,<4",
    "pyautogui>=0.9,<1",
    "anthropic>=0.40,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
notifications = [
    "plyer>=2.1,<3",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "aiosqlite>=0.20,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[project.scripts]
jarvis = "jarvis.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
